<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roue des déchets dangereux</title>

    <link rel="stylesheet" href="style_dangereux.css">
</head>

<body>

    <h1>Roue des déchets dangereux</h1>

    <div class="zone-roue">
        <div class="image-gauche">
        <img src="images/image_personnage_dangereux_1.png" 
             alt="Déchet">
        </div>

        <div class="roue-container">

            <img src="images/roue_dechets_dangereux.png"
                 id="roue-dangereux"
                 class="roue"
                 alt="Roue des déchets dangereux">

            <img src="images/roue_poubelles_dangereux.png"
                 class="roue-poubelles"
                 alt="Disque supérieur">

        </div>

        <div class="liens-roues">

            <a href="index.html" class="bouton-lien">
                Roue des déchets non dangereux
            </a>

            <a href="roue_metallique.html" class="bouton-lien">
                Roue des déchets métalliques
            </a>

        </div>

    </div>

    <div class="boutons">

        <button id="spin-gauche">↶ Tourner à gauche</button>

        <button id="spin-droite">Tourner à droite ↷</button>

    </div>

    <script src="script.js"></script>

</body>

</html>
