<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roue des déchets métalliques</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="style_metallique.css">
</head>

<body>

    <h1>Roue des déchets métalliques</h1>

    <div class="zone-roue">
        <div class="image-gauche">
        <img src="images/image_personnage_métallique_1.png" 
             alt="Déchet">
        </div>

        <div class="roue-container">

            <img src="images/roue_dechets_metalliques.png"
                 id="roue-metallique"
                 class="roue"
                 alt="Roue des déchets métalliques">

            <img src="images/roue_poubelles_metalliques.png"
                 class="roue-poubelles"
                 alt="Disque supérieur">

        </div>

        <div class="liens-roues">

            <a href="index.html" class="bouton-lien">
                Roue des déchets non dangreux
            </a>

            <a href="roue_dangereux.html" class="bouton-lien">
                Roue des déchets dangereux
            </a>

        </div>

    </div>

    <div class="boutons">

        <button id="spin-gauche">↶ Tourner à gauche</button>

        <button id="spin-droite">Tourner à droite ↷</button>

    </div>

    <script src="script.js"></script>

</body>

</html>
