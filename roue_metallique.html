<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roue des déchets métalliques</title>

    <link rel="stylesheet" href="style_non_dangereux.css">
    <link rel="stylesheet" href="style_metallique.css">
</head>

<body>

    <h1>Roue des déchets métalliques</h1>

    <div class="zone-roue">

        <div class="roue-container">

            <img src="images/roue_dechets_metalliques.png"
                 class="roue"
                 alt="Roue des déchets métalliques">

            <img src="images/roue_poubelle_metallique.png"
                 class="roue-poubelles"
                 alt="Disque supérieur métallique">

        </div>

        <div class="liens-roues">

            <a href="roue_non_dangereux.html" class="bouton-lien">
                Roue des déchets
            </a>

            <a href="roue_dangereux.html" class="bouton-lien">
                Roue dangereux
            </a>

        </div>

    </div>

    <div class="boutons">

        <button id="spin-gauche">
            ↶ Tourner à gauche
        </button>

        <button id="spin-droite">
            Tourner à droite ↷
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
